name: ci

on:
  push:
    branches: [main, fix/ready-deploy-final]
  pull_request:
    branches: [main, fix/ready-deploy-final]

# Cancel superseded runs on the same ref instead of burning minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Build
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          exit "$status"

      - name: Copy build log
        if: always()
        working-directory: .
        run: cp apps/web/build.log build.log || true

      - name: Package production readiness archive
        if: success()
        working-directory: .
        run: |
          zip -qr dibasala-production-ready-ruamhcchaeogodsltskw.zip \
            apps/web/src apps/web/dist supabase/migrations supabase/functions \
            SOURCE_MAP.md CURRENT_STATE.md DEPLOY_READINESS.md ROLLBACK.md build.log
          sha256sum dibasala-production-ready-ruamhcchaeogodsltskw.zip > dibasala-production-ready-ruamhcchaeogodsltskw.zip.sha256

      - name: Upload production readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dibasala-production-readiness
          path: |
            build.log
            dibasala-production-ready-ruamhcchaeogodsltskw.zip
            dibasala-production-ready-ruamhcchaeogodsltskw.zip.sha256
          if-no-files-found: warn
          retention-days: 14
