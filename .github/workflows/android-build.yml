name: Android APK and source ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/premium-sslcommerz-subscriptions

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Add Capacitor Android wrapper
        working-directory: apps/web
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          printf 'import type { CapacitorConfig } from "@capacitor/cli";\nconst config: CapacitorConfig = { appId: "com.dibasala.app", appName: "DIBASALA", webDir: "dist", bundledWebRuntime: false, server: { androidScheme: "https" } };\nexport default config;\n' > capacitor.config.ts
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Package clean source ZIP
        run: |
          git archive --format=zip --output=dibasala-source.zip HEAD
          sha256sum dibasala-source.zip > dibasala-source.zip.sha256
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk dibasala-debug.apk
          sha256sum dibasala-debug.apk > dibasala-debug.apk.sha256

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dibasala-android-qc-build
          path: |
            dibasala-debug.apk
            dibasala-debug.apk.sha256
            dibasala-source.zip
            dibasala-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
